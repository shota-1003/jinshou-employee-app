<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>迅翔興業 社員ポータル</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<meta name="theme-color" content="#1a3a6b">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>迅翔興業 社員ポータル</header>
<main>

  <!-- ログイン画面 -->
  <section id="screen-login" class="screen">
    <div class="card">
      <label for="login-code">社員番号</label>
      <input type="text" id="login-code" inputmode="numeric" placeholder="例: 0001" autocomplete="off">
      <div class="hint">最初の1回だけ入力すれば、次回から自動的にログインします。</div>
      <div class="error" id="login-error">社員番号が確認できませんでした。</div>
      <button id="login-btn">ログイン</button>
    </div>
  </section>

  <!-- メニュー画面 -->
  <section id="screen-menu" class="screen">
    <div class="greeting" id="menu-greeting"></div>

    <div class="section-title">申請</div>
    <div class="menu-list">
      <button type="button" class="menu-item" data-nav="leave">
        <div>有給休暇申請<span class="desc">開始日・終了日を選ぶだけ(日数は自動計算)</span></div>
        <div class="arrow">›</div>
      </button>
      <button type="button" class="menu-item" data-nav="expense">
        <div>経費立替申請<span class="desc">領収書を撮影して申請(複数まとめて可)</span></div>
        <div class="arrow">›</div>
      </button>
      <button type="button" class="menu-item" data-nav="meeting">
        <div>会議申請<span class="desc">会議費の申請</span></div>
        <div class="arrow">›</div>
      </button>
      <button type="button" class="menu-item" data-nav="supply-request">
        <div>支給品申請<span class="desc">制服・安全用品などを申請</span></div>
        <div class="arrow">›</div>
      </button>
      <button type="button" class="menu-item disabled" disabled>
        <div>資格申請<span class="desc">準備中です</span></div>
        <div class="arrow">›</div>
      </button>
    </div>

    <div class="section-title">自分の情報</div>
    <div class="menu-list">
      <button type="button" class="menu-item" data-nav="history">
        <div>申請履歴<span class="desc">これまでの申請と状態を確認</span></div>
        <div class="arrow">›</div>
      </button>
      <button type="button" class="menu-item" data-nav="my-supply">
        <div>支給品履歴<span class="desc">これまで支給された物を確認</span></div>
        <div class="arrow">›</div>
      </button>
    </div>

    <div class="section-title" id="admin-section-title" style="display:none;">管理者メニュー</div>
    <div class="menu-list" id="admin-menu-list" style="display:none;">
      <button type="button" class="menu-item" data-nav="admin">
        <div>社員検索・支給品管理<span class="desc">社員別の有給・支給品状況を確認</span></div>
        <div class="arrow">›</div>
      </button>
    </div>

    <button class="link" id="logout-btn">別の社員番号でログインし直す</button>
  </section>

  <!-- 有給申請フォーム -->
  <section id="screen-leave" class="screen">
    <button type="button" class="back-link" data-nav="menu">‹ メニューに戻る</button>

    <div class="card summary-card">
      <div class="summary-row"><span>有給残日数</span><span class="summary-value" id="leave-summary-balance">-</span></div>
      <div class="summary-row"><span>今年使用</span><span class="summary-value" id="leave-summary-used">-</span></div>
      <div class="summary-row"><span>今年取得回数</span><span class="summary-value" id="leave-summary-count">-</span></div>
      <div class="hint-inline" id="leave-summary-note"></div>
    </div>
    <button type="button" class="secondary" data-nav="leave-history">取得履歴を見る</button>

    <div class="card">
      <div class="form-title">有給休暇申請</div>
      <label for="leave-start">開始日</label>
      <input type="date" id="leave-start">
      <label for="leave-end">終了日</label>
      <input type="date" id="leave-end">
      <div class="checkbox-row">
        <input type="checkbox" id="leave-half">
        <label for="leave-half">半休(開始日と終了日が同じ日のみ)</label>
      </div>
      <div class="calc-box" id="leave-days-box">日数: -</div>
      <div class="balance-box" id="leave-balance-box"></div>
      <label for="leave-reason">事由</label>
      <input type="text" id="leave-reason" placeholder="例: 私用のため">
      <label for="leave-note">備考</label>
      <div class="hint-inline">任意</div>
      <textarea id="leave-note"></textarea>
      <div class="error" id="leave-error"></div>
      <button id="leave-submit">申請する</button>
    </div>
  </section>

  <!-- 経費立替申請フォーム(複数明細) -->
  <section id="screen-expense" class="screen">
    <button type="button" class="back-link" data-nav="menu">‹ メニューに戻る</button>
    <div class="form-title">経費立替申請</div>
    <div class="hint" style="margin: 0 0 14px;">領収書の写真が必要です。複数の領収書をまとめて1回の申請にできます。</div>

    <div id="expense-item-list"></div>

    <button type="button" class="secondary" id="expense-add-item">＋ 明細を追加</button>

    <div class="card total-card">
      <div class="total-row"><span>明細件数</span><span id="expense-total-count">0件</span></div>
      <div class="total-row total-amount"><span>合計金額</span><span id="expense-total-amount">0円</span></div>
    </div>

    <div class="error" id="expense-error"></div>
    <button id="expense-submit">この内容で申請する</button>

    <!-- 明細1件分のテンプレート(JSで複製して使う) -->
    <template id="expense-item-template">
      <div class="card expense-item-card">
        <div class="item-header">
          <span class="item-label"></span>
          <button type="button" class="remove-item-btn">削除</button>
        </div>
        <label>領収書の写真</label>
        <div class="hint-inline">カメラで撮影、または写真を選択(必須)</div>
        <input type="file" accept="image/*" capture="environment" class="item-photo-input">
        <img class="item-photo-preview" style="display:none;">
        <div class="photo-status"></div>

        <label>利用日</label>
        <input type="date" class="item-date">

        <label>支払先</label>
        <div class="hint-inline">例: ○○ガソリンスタンド</div>
        <input type="text" class="item-store">

        <label>金額(円)</label>
        <input type="number" class="item-amount" min="1">

        <label>現場名</label>
        <div class="hint-inline">例: ○○現場</div>
        <input type="text" class="item-site">

        <label>使用目的</label>
        <div class="hint-inline">例: 給油代</div>
        <input type="text" class="item-purpose">

        <label>備考</label>
        <div class="hint-inline">任意</div>
        <input type="text" class="item-note">
      </div>
    </template>
  </section>

  <!-- 会議申請フォーム -->
  <section id="screen-meeting" class="screen">
    <button type="button" class="back-link" data-nav="menu">‹ メニューに戻る</button>
    <div class="card">
      <div class="form-title">会議申請</div>
      <label for="meeting-date">会議日</label>
      <input type="date" id="meeting-date">
      <label for="meeting-place">場所</label>
      <input type="text" id="meeting-place" placeholder="例: 本社会議室">
      <label for="meeting-headcount">人数</label>
      <input type="number" id="meeting-headcount" min="1" placeholder="例: 3">
      <div class="checkbox-row">
        <input type="checkbox" id="meeting-meal">
        <label for="meeting-meal">食事あり</label>
      </div>
      <label for="meeting-content">会議内容</label>
      <input type="text" id="meeting-content" placeholder="例: 現場定例会議">
      <label for="meeting-amount">申請金額(円)</label>
      <input type="number" id="meeting-amount" min="0">
      <label for="meeting-receive">受取方法</label>
      <select id="meeting-receive">
        <option value="cash">現金</option>
        <option value="bank_transfer">振込み(振込手数料は申請者負担)</option>
      </select>
      <div class="error" id="meeting-error"></div>
      <button id="meeting-submit">申請する</button>
    </div>
  </section>

  <!-- 申請履歴 -->
  <section id="screen-history" class="screen">
    <button type="button" class="back-link" data-nav="menu">‹ メニューに戻る</button>
    <div class="form-title">申請履歴</div>
    <div id="history-list"></div>
  </section>

  <!-- 有給取得履歴 -->
  <section id="screen-leave-history" class="screen">
    <button type="button" class="back-link" data-nav="leave">‹ 戻る</button>
    <div class="form-title">有給取得履歴</div>
    <div id="leave-history-list"></div>
  </section>

  <!-- 支給品申請フォーム -->
  <section id="screen-supply-request" class="screen">
    <button type="button" class="back-link" data-nav="menu">‹ メニューに戻る</button>
    <div class="card">
      <div class="form-title">支給品申請</div>
      <label for="supply-req-item">支給品名</label>
      <div class="hint-inline">例: 制服ジャケット、ヘルメット、安全靴</div>
      <input type="text" id="supply-req-item">
      <label for="supply-req-qty">数量</label>
      <input type="number" id="supply-req-qty" min="1" value="1">
      <label for="supply-req-size">サイズ</label>
      <div class="hint-inline">必要な物のみ(任意)</div>
      <input type="text" id="supply-req-size">
      <label for="supply-req-reason">申請理由</label>
      <input type="text" id="supply-req-reason" placeholder="例: 破損のため交換希望">
      <div class="error" id="supply-req-error"></div>
      <button id="supply-req-submit">申請する</button>
    </div>
  </section>

  <!-- 自分の支給品履歴 -->
  <section id="screen-my-supply" class="screen">
    <button type="button" class="back-link" data-nav="menu">‹ メニューに戻る</button>
    <div class="form-title">支給品履歴</div>
    <div id="my-supply-list"></div>
  </section>

  <!-- 管理者画面 -->
  <section id="screen-admin" class="screen">
    <button type="button" class="back-link" data-nav="menu">‹ メニューに戻る</button>
    <div class="form-title">社員検索・支給品管理</div>

    <div class="card">
      <label for="admin-employee-select">社員を選択</label>
      <select id="admin-employee-select"></select>
      <div id="admin-employee-detail"></div>
    </div>

    <div class="section-title">支給品を記録する(実際に渡した時)</div>
    <div class="card">
      <label for="admin-issue-employee">対象社員</label>
      <select id="admin-issue-employee"></select>
      <label for="admin-issue-date">支給日</label>
      <input type="date" id="admin-issue-date">
      <label for="admin-issue-item">支給品名</label>
      <input type="text" id="admin-issue-item">
      <label for="admin-issue-qty">数量</label>
      <input type="number" id="admin-issue-qty" min="1" value="1">
      <label for="admin-issue-size">サイズ</label>
      <input type="text" id="admin-issue-size">
      <label for="admin-issue-condition">新品／中古</label>
      <select id="admin-issue-condition">
        <option value="new">新品</option>
        <option value="used">中古</option>
      </select>
      <label for="admin-issue-reason">支給理由</label>
      <input type="text" id="admin-issue-reason">
      <div class="checkbox-row">
        <input type="checkbox" id="admin-issue-return">
        <label for="admin-issue-return">返却必要</label>
      </div>
      <label for="admin-issue-note">備考</label>
      <input type="text" id="admin-issue-note">
      <div class="error" id="admin-issue-error"></div>
      <button id="admin-issue-submit">記録する</button>
    </div>

    <div class="section-title">支給品を検索</div>
    <div class="card">
      <label for="admin-search-item">品目名で絞り込み</label>
      <input type="text" id="admin-search-item" placeholder="例: 制服">
      <div class="checkbox-row">
        <input type="checkbox" id="admin-search-unreturned">
        <label for="admin-search-unreturned">未返却のみ</label>
      </div>
      <button type="button" class="secondary" id="admin-search-btn">検索</button>
    </div>
    <div id="admin-search-results"></div>
  </section>

  <!-- 完了画面 -->
  <section id="screen-done" class="screen">
    <div class="card center">
      <div class="success-icon">✓</div>
      <div id="done-message" style="font-size:15px; line-height:1.6;"></div>
      <button class="secondary" data-nav="menu">メニューに戻る</button>
    </div>
  </section>

</main>
<script src="app.js"></script>
</body>
</html>
