<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>資材総数管理｜専用アプリへ移動</title><style>body{font-family:system-ui,sans-serif;margin:40px;color:#173c41}a{color:#176b61}</style></head><body><h1>資材総数管理</h1><p>資材管理は専用アプリに移動しました。登録済みのデータは引き継がれます。</p><a id="destination" href="https://shota-1003.github.io/jinshou-material-management/">資材総数管理を開く</a><script>const destination=new URL('https://shota-1003.github.io/jinshou-material-management/');const source=new URLSearchParams(location.search);if(source.get('portal')==='sub')destination.searchParams.set('portal','sub');if(source.has('switch'))destination.searchParams.set('switch','1');document.getElementById('destination').href=destination.href;location.replace(destination.href);</script></body></html>
