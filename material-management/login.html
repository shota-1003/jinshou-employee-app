<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>資材総数管理｜ログイン</title><meta name="theme-color" content="#102746"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#18304f;font-family:system-ui,sans-serif}main{max-width:440px;margin:8vh auto;padding:28px;background:white;border:1px solid #e2e7ef;border-radius:8px}h1{font-size:24px}p{line-height:1.7}label{display:block;margin:20px 0 8px}input,button,select{font:inherit;width:100%;padding:14px;border:1px solid #c9d3df;border-radius:5px}button{margin-top:22px;background:#214b7c;color:white;cursor:pointer}button:disabled{opacity:.55}a{color:#214b7c}#status{min-height:2em;white-space:pre-wrap}small{display:block;line-height:1.7;color:#63758c}@media(max-width:480px){main{margin:20px 12px;padding:22px}}
</style></head><body><main><h1>資材総数管理</h1><p>いつものログイン番号と暗証番号で入れます。</p><form id="login"><label for="kind">利用者</label><select id="kind"><option value="employee">社員</option><option value="worker">協力会社</option></select><label id="code-label" for="code">社員番号</label><input id="code" autocomplete="username" required maxlength="80"><label for="pin">暗証番号</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" required maxlength="6"><button id="submit" type="submit">ログイン</button></form><p id="status" role="status" aria-live="polite"></p><small>初回登録・暗証番号の再設定は、現在の登録窓口で行えます。</small><p><a id="help" href="https://shota-1003.github.io/jinshou-employee-app/">初回登録・暗証番号を忘れた方</a></p></main><script src="entry-login.js?build=e5340cb47aa0"></script></body></html>
