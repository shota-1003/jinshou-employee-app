:root{--bg:#f1f4f6;--ink:#17304f;--muted:#748483;--green:#1765d1;--line:#dde5e3}*{box-sizing:border-box}body{margin:0;font-family:'Yu Gothic UI','Meiryo',sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}aside{position:fixed;width:228px;inset:0 auto 0 0;background:#102746;color:white;padding:32px 20px}aside h2{font-size:18px;letter-spacing:2px;margin:0 0 6px}aside small{color:#86a9d4}aside nav{margin-top:48px}aside button{display:block;width:100%;text-align:left;background:none;color:#a9bdd8;padding:16px;border-radius:8px;margin:6px 0}aside button.active{background:#214a7d;color:white}aside footer{position:absolute;bottom:28px;font-size:12px;color:#a9beb7;line-height:2}main{margin-left:228px;padding:30px 42px;max-width:1600px}.top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:32px}.badge{border:1px solid #c9d9d4;border-radius:20px;padding:7px 12px;background:#e8effa;color:#315e95}.hero{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{font-size:30px;letter-spacing:1px;margin:6px 0 8px}h2{font-size:19px}p{color:var(--muted);line-height:1.8;margin:6px 0}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--green);font-weight:bold}.primary{background:var(--green);color:white;padding:12px 20px;border-radius:7px}.secondary{background:white;border:1px solid var(--line);padding:10px 15px;border-radius:7px;color:var(--ink)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:22px}.stat strong{font-size:32px;display:block;margin-top:10px}.stat span{font-size:12px;color:var(--muted)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px #163a3010}.cover{height:140px;background:linear-gradient(130deg,#3e84da,#143967);position:relative;padding:22px;color:white;overflow:hidden}.cover:after{content:'';position:absolute;right:30px;bottom:-10px;width:120px;height:110px;border:12px solid #ffffff20;box-shadow:40px -35px 0 #ffffff12}.cover b{font-size:42px;font-weight:300;color:#ffffff65}.body{padding:22px}.body h2{margin:12px 0}.pill{display:inline-block;font-size:11px;padding:5px 9px;border-radius:5px;background:#eaf2fd;color:#2364ad}.warn{background:#fff0df;color:#ac651b}.red{background:#fbe9e7;color:#ae4b40}.meta{font-size:12px;color:var(--muted);line-height:2}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:24px 0;overflow:auto}.tabs button{white-space:nowrap;background:none;padding:14px 18px;color:var(--muted);border-bottom:3px solid transparent}.tabs button.active{color:var(--green);border-color:var(--green);font-weight:bold}.two{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}.field{margin-bottom:16px}label{display:block;font-size:12px;margin-bottom:8px;font-weight:bold}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d3dfda;border-radius:6px;background:white;color:var(--ink)}input[type=checkbox]{width:auto}textarea{min-height:85px}.table{width:100%;border-collapse:collapse}.table th{text-align:left;font-size:11px;color:var(--muted);font-weight:normal;padding:14px;border-bottom:1px solid var(--line)}.table td{padding:18px 14px;border-bottom:1px solid var(--line);font-size:13px}.table tr:last-child td{border:0}.item{padding:18px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item h3{font-size:15px;margin:8px 0}.empty{padding:54px 20px;text-align:center;color:var(--muted)}dialog{border:0;border-radius:16px;width:min(780px,94vw);max-height:90vh;padding:28px;color:var(--ink)}dialog::backdrop{background:#102b2ac0;backdrop-filter:blur(4px)}dialog h2{margin-top:0}.modalfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.checklist{display:flex;gap:12px;flex-wrap:wrap;padding:12px;border:1px solid var(--line);border-radius:6px}.checklist label{margin:0}canvas{width:100%;border:1px solid var(--line);border-radius:8px;touch-action:none;background:#edf2f0}.photo{width:100%;max-height:220px;object-fit:contain;background:#f2f5f3}.notice{padding:14px 18px;border-left:3px solid #ba934e;background:#fff8e9;font-size:12px;line-height:1.8;margin-bottom:20px}.toast{position:fixed;bottom:25px;right:25px;background:#164580;color:white;padding:16px 24px;border-radius:8px;z-index:9}.search{max-width:320px}.details{line-height:2.3;font-size:14px}.details b{display:inline-block;min-width:95px}.taskdone{text-decoration:line-through;color:var(--muted)}@media(max-width:1000px){.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}main{padding:25px}.stats{gap:8px}.stat{padding:15px}}@media(max-width:700px){aside{position:static;width:100%;padding:16px}aside nav{display:flex;margin:12px 0 0}aside button{padding:10px;margin:0}aside footer,aside small{display:none}main{margin:0;padding:20px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.hero{align-items:flex-start;gap:10px}h1{font-size:24px}.table td,.table th{padding:12px 7px}.top{margin-bottom:22px}.panel{padding:16px}}

<script>
const seed={companies:[{id:1,name:'青葉建設株式会社',phone:'03-0000-0001',address:'東京都中央区（サンプル）',people:[{name:'田中 一郎',dept:'工事部',phone:'090-0000-0001',email:'tanaka@example.com'},{name:'佐藤 美咲',dept:'品質管理部',phone:'090-0000-0002',email:'sato@example.com'}]},{id:2,name:'東都不動産株式会社',phone:'03-0000-0003',address:'東京都港区（サンプル）',people:[{name:'鈴木 健',dept:'開発部',phone:'090-0000-0003',email:'suzuki@example.com'}]}],sites:[{id:1,name:'青葉レジデンス 新築工事',address:'東京都中央区 青葉町 2-4（サンプル）',status:'施工中',start:'2026-09-01',end:'2027-03-31',prime:1,client:2,primePeople:['田中 一郎','佐藤 美咲'],clientPeople:['鈴木 健'],note:'入場時は北側ゲートを使用。駐車は指定区画へ。'},{id:2,name:'港南オフィス 外壁改修',address:'東京都港区 港南 1-2（サンプル）',status:'施工中',start:'2026-09-10',end:'2026-12-20',prime:1,client:2,primePeople:['佐藤 美咲'],clientPeople:['鈴木 健'],note:'居住・利用者の動線を確保してください。'},{id:3,name:'緑丘マンション 共用部改修',address:'東京都世田谷区 緑丘 3-1（サンプル）',status:'着工前',start:'2026-10-01',end:'2027-01-31',prime:1,client:2,primePeople:['田中 一郎'],clientPeople:[],note:''}],repairs:[{id:1,site:1,title:'ベランダ手すりの塗装補修',location:'2階 / 202号室 / ベランダ',due:'2026-09-18',assignee:'',status:'未対応',note:'写真の指示箇所を確認して補修してください。',history:[]},{id:2,site:1,title:'エントランス壁面のキズ補修',location:'1階 / エントランス',due:'2026-09-16',assignee:'山田 太郎',status:'確認待ち',note:'養生撤去後に確認してください。',history:['山田 太郎が完了確認を依頼（サンプル）']},{id:3,site:2,title:'シーリングの仕上げ確認',location:'3階 / 南面',due:'2026-09-20',assignee:'',status:'対応中',note:'現場に行った方が対応してください。',history:[]}],tasks:[{id:1,site:1,title:'搬入経路の確認',done:false},{id:2,site:1,title:'安全書類の提出',done:true}],files:[],reports:[]};
const MAIN_KEY='jinshou-site-prototype-v1';let mainSnapshot=null,mainStorageError='',state;
try{mainSnapshot=localStorage.getItem(MAIN_KEY);state=mainSnapshot?JSON.parse(mainSnapshot):structuredClone(seed);if(!state||typeof state!=='object'||['companies','sites','repairs','tasks','files','reports'].some(k=>!Array.isArray(state[k])))throw Error('保存データの形式を確認できません')}catch(e){mainStorageError='保存データを読み込めません。元のデータは保持しています。編集を止め、管理者に端末内データの保全と復旧を依頼してください。';state=structuredClone(seed)}
window.addEventListener('error',e=>{if(e.error?.name==='SiteSaveError'){e.preventDefault();notify(e.error.message)}});
let page='sites',siteId=1,tab='概要';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{if(mainStorageError)throw Error(mainStorageError);if(localStorage.getItem(MAIN_KEY)!==mainSnapshot)throw Error('別の画面で更新されています。入力内容を控え、再読み込みしてから保存してください。');const next=JSON.stringify(state);localStorage.setItem(MAIN_KEY,next);mainSnapshot=next;return true}catch(cause){try{state=mainSnapshot?JSON.parse(mainSnapshot):structuredClone(seed)}catch{}const error=new Error(mainStorageError||(cause.message?.includes('別の画面')?cause.message:'保存できませんでした。入力画面は閉じずに、空き容量を確認し、管理者に連絡してください。'));error.name='SiteSaveError';if(document.getElementById('toast'))notify(error.message);throw error}}function notify(t){$('toast').textContent=t;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,3500)}function navigate(p){page=p;render()}function openSite(id){siteId=id;page='detail';tab='概要';render()}function company(id){return state.companies.find(c=>c.id===Number(id))}function pill(t){return `<span class="pill ${t==='未対応'?'warn':t==='確認待ち'?'red':''}">${esc(t)}</span>`}function show(html){$('modal').innerHTML=html;$('modal').showModal()}function closeModal(){$('modal').close()}function foot(label='保存する'){return `<div class="modalfoot"><button type="button" class="secondary" onclick="closeModal()">キャンセル</button><button class="primary">${label}</button></div>`}function heading(k,title,desc,button=''){return `<div class="hero"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p>${desc}</p></div>${button}</div>`}
function render(){document.querySelectorAll('[data-nav]').forEach(e=>e.classList.toggle('active',e.dataset.nav===(page==='detail'?'sites':page)));let html='';if(page==='sites'){html=heading('PROJECTS','現場一覧','現場の進み具合も、必要な情報も、ここから。','<button class="primary" onclick="siteForm()">＋ 現場を登録</button>')+`<div class="stats"><div class="stat"><span>登録現場</span><strong>${state.sites.length}<small> 件</small></strong></div><div class="stat"><span>施工中</span><strong>${state.sites.filter(s=>s.status==='施工中').length}<small> 件</small></strong></div><div class="stat"><span>未完了の手直し</span><strong>${state.repairs.filter(r=>r.status!=='完了').length}<small> 件</small></strong></div><div class="stat"><span>確認待ち</span><strong>${state.repairs.filter(r=>r.status==='確認待ち').length}<small> 件</small></strong></div></div><div class="row between" style="margin-bottom:20px"><h2>すべての現場</h2><input class="search" placeholder="現場名・住所を検索" oninput="filterCards(this.value)"></div><div class="grid">${state.sites.map(s=>`<article class="card" data-search="${esc(s.name+' '+s.address)}" onclick="openSite(${s.id})" tabindex="0" onkeydown="if(event.key==='Enter')openSite(${s.id})"><div class="cover"><b>0${s.id}</b></div><div class="body">${pill(s.status)}<h2>${esc(s.name)}</h2><div class="meta">${esc(s.address)}<br>${esc(s.start)} — ${esc(s.end)}</div><div class="row between" style="margin-top:20px"><span class="pill warn">手直し ${state.repairs.filter(r=>r.site===s.id&&r.status!=='完了').length}件</span><span>現場を開く →</span></div></div></article>`).join('')}</div>`}
else if(page==='customers'){html=heading('CONTACT DIRECTORY','顧客・取引先','会社と担当者を一度登録。各現場から選んで使えます。','<button class="primary" onclick="companyForm()">＋ 会社を登録</button>')+state.companies.map(c=>`<section class="panel" style="margin-bottom:20px"><div class="row between"><div><h2>${esc(c.name)}</h2><p>${esc(c.address)}　｜　${esc(c.phone)}</p></div><button class="secondary" onclick="personForm(${c.id})">＋ 担当者を追加</button><button class="primary" onclick="cardForm(${c.id})">名刺から担当者を追加</button></div><table class="table"><thead><tr><th>担当者 / 部署</th><th>電話番号</th><th>メール</th></tr></thead><tbody>${c.people.map(p=>`<tr><td><b>${esc(p.name)}</b><br><span class="meta">${esc(p.dept)}</span></td><td>${esc(p.phone)}</td><td>${esc(p.email)}</td></tr>`).join('')}</tbody></table>${contactSummary(c.id)}</section>`).join('')}
else if(page==='repairs'){html=heading('QUALITY CONTROL','手直し案件','期限までに、現場に行った人が対応。写真で確認までつなげます。','<button class="primary" onclick="repairForm()">＋ 手直しを登録</button>')+repairList(state.repairs)}
else{let s=state.sites.find(s=>s.id===siteId);html=`<button class="secondary" onclick="navigate('sites')">← 現場一覧</button>`+heading('PROJECT / 0'+s.id,esc(s.name),esc(s.address),pill(s.status))+`<div class="tabs">${['概要','工程表','タスク','報告','写真','資料','手直し案件'].map(t=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${t}${t==='手直し案件'?' '+state.repairs.filter(r=>r.site===siteId&&r.status!=='完了').length:''}</button>`).join('')}</div>`;if(tab==='概要'){html+=`<div class="two"><section class="panel"><div class="row between"><h2>現場概要</h2><button class="secondary" onclick="siteForm(${s.id})">編集</button></div><div class="details"><b>所在地</b>${esc(s.address)}<br><b>工期</b>${esc(s.start)} ～ ${esc(s.end)}<br><b>注意事項</b>${esc(s.note||'未登録')}</div>${['prime','client'].map((k,i)=>`<div class="item"><span class="eyebrow">${i?'発注者':'元請け'}</span><h2>${esc(company(s[k])?.name||'未登録')}</h2>${(s[k+'People']||[]).map(n=>{let p=company(s[k])?.people.find(p=>p.name===n);return `<div class="item"><b>${esc(n)}</b>　<span class="meta">${esc(p?.dept)}</span><p>${esc(p?.phone)}　${esc(p?.email)}</p></div>`}).join('')||'<p>担当者未登録</p>'}</div>`).join('')}</section><section class="panel"><h2>現場で確認すること</h2>${repairList(state.repairs.filter(r=>r.site===siteId&&r.status!=='完了'),true)}</section></div>`}else if(tab==='手直し案件'){html+=`<div class="row between"><p>担当者の指定は任意・期限は必須</p><button class="primary" onclick="repairForm(${siteId})">＋ 手直しを登録</button></div>`+repairList(state.repairs.filter(r=>r.site===siteId))}else if(['工程表','写真','資料'].includes(tab)){html+=filePanel()}else if(tab==='タスク'){html+=`<section class="panel"><div class="row between"><h2>現場のタスク</h2><button class="primary" onclick="taskForm()">＋ タスク</button></div>${state.tasks.filter(t=>t.site===siteId).map(t=>`<div class="item"><label class="${t.done?'taskdone':''}"><input type="checkbox" ${t.done?'checked':''} onchange="state.tasks.find(t=>t.id===${t.id}).done=this.checked;save();render()">　${esc(t.title)}</label></div>`).join('')||'<div class="empty">タスクを登録してください</div>'}</section>`}else{html+=`<section class="panel"><div class="row between"><h2>現場の報告</h2><button class="primary" onclick="reportForm()">＋ 報告を作成</button></div>${state.reports.filter(r=>r.site===siteId).map(r=>`<div class="item"><h3>${esc(r.title)}</h3><p>${esc(r.note)}</p><small>${esc(r.date)}</small></div>`).join('')||'<div class="empty">進捗や気づいたことを記録しましょう。</div>'}</section>`}}$('app').innerHTML=html}
function filterCards(q){document.querySelectorAll('[data-search]').forEach(e=>e.hidden=!e.dataset.search.includes(q))}function repairList(rs,compact=false){return `<section class="${compact?'':'panel'}" style="margin-top:18px">${rs.map(r=>`<div class="item"><div class="row between">${pill(r.status)}<span class="meta">期限 ${esc(r.due)}</span></div><h3>${esc(r.title)}</h3><div class="meta">${esc(state.sites.find(s=>s.id===r.site)?.name)}<br>${esc(r.location)}　｜　${esc(r.assignee||'担当者未指定・現場に行った方が対応')}</div><button class="secondary" style="margin-top:12px" onclick="repairDetail(${r.id})">詳細・対応する →</button></div>`).join('')||'<div class="empty">該当する手直し案件はありません</div>'}</section>`}
function companyForm(){show(`<h2>会社を登録</h2><form onsubmit="event.preventDefault();state.companies.push({id:Date.now(),name:this.name.value,address:this.address.value,phone:this.phone.value,people:[]});save();closeModal();render()"><label>会社名（必須）</label><input name="name" required><label>住所</label><input name="address"><label>代表電話</label><input name="phone" type="tel">${foot()}</form>`)}function personForm(id){show(`<h2>担当者を追加</h2><p>${esc(company(id).name)}</p><form onsubmit="event.preventDefault();company(${id}).people.push({name:this.person.value,dept:this.dept.value,phone:this.phone.value,email:this.email.value});save();closeModal();render()">${[['person','氏名（必須）'],['dept','部署'],['phone','電話番号'],['email','メールアドレス']].map(([n,l])=>`<div class="field"><label>${l}</label><input name="${n}" ${n==='person'?'required':''} ${n==='email'?'type="email"':''}></div>`).join('')}${foot()}</form>`)}
function peoplePicker(k,id,selected=[]){$(k+'Contacts').innerHTML=(company(id)?.people||[]).map(p=>`<label><input type="checkbox" name="${k}People" value="${esc(p.name)}" ${selected.includes(p.name)?'checked':''}> ${esc(p.name)}</label>`).join('')||'登録された担当者がいません'}function siteForm(id){let s=state.sites.find(s=>s.id===id)||{};show(`<h2>${id?'現場概要を編集':'現場を登録'}</h2><form id="siteForm">${[['name','現場名'],['address','所在地'],['start','着工日'],['end','完了予定日']].map(([k,l])=>`<div class="field"><label>${l}</label><input name="${k}" ${k==='name'?'required':''} type="${['start','end'].includes(k)?'date':'text'}" value="${esc(s[k]||'')}"></div>`).join('')}<label>状況</label><select name="status">${['着工前','施工中','完了'].map(t=>`<option ${s.status===t?'selected':''}>${t}</option>`).join('')}</select>${['prime','client'].map((k,i)=>`<div class="field"><label>${i?'発注者':'元請け'}会社</label><select name="${k}" onchange="peoplePicker('${k}',this.value)"><option value="">未選択</option>${state.companies.map(c=>`<option value="${c.id}" ${s[k]===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><label style="margin-top:10px">担当者（複数選択可）</label><div class="checklist" id="${k}Contacts"></div></div>`).join('')}<label>注意事項</label><textarea name="note">${esc(s.note||'')}</textarea>${foot()}</form>`);['prime','client'].forEach(k=>peoplePicker(k,s[k],s[k+'People']));$('siteForm').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target),v=Object.fromEntries(d);v.id=id||Date.now();v.prime=Number(v.prime);v.client=Number(v.client);v.primePeople=d.getAll('primePeople');v.clientPeople=d.getAll('clientPeople');if(v.start&&v.end&&v.end<v.start){notify('完了予定日は着工日以降を指定してください');return}if(id)Object.assign(s,v);else state.sites.push(v);save();closeModal();render()}}
let drawing=null,basePhoto='',tool='circle';function setupCanvas(){const c=$('markCanvas'),ctx=c.getContext('2d');ctx.fillStyle='#edf2f0';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#748483';ctx.font='18px sans-serif';ctx.fillText('写真を選択すると、丸・バツ・矢印を書き込めます',35,170);let start,snapshot;const point=e=>{let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}};c.onpointerdown=e=>{if(!basePhoto)return;start=point(e);snapshot=ctx.getImageData(0,0,c.width,c.height);c.setPointerCapture(e.pointerId)};c.onpointerup=e=>{if(!start)return;let p=point(e);ctx.putImageData(snapshot,0,0);ctx.strokeStyle='#f43b36';ctx.lineWidth=5;ctx.beginPath();if(tool==='circle'){ctx.ellipse((start.x+p.x)/2,(start.y+p.y)/2,Math.max(1,Math.abs(p.x-start.x)/2),Math.max(1,Math.abs(p.y-start.y)/2),0,0,Math.PI*2)}else if(tool==='cross'){ctx.moveTo(start.x,start.y);ctx.lineTo(p.x,p.y);ctx.moveTo(start.x,p.y);ctx.lineTo(p.x,start.y)}else{ctx.moveTo(start.x,start.y);ctx.lineTo(p.x,p.y);let a=Math.atan2(p.y-start.y,p.x-start.x);ctx.moveTo(p.x-23*Math.cos(a-.5),p.y-23*Math.sin(a-.5));ctx.lineTo(p.x,p.y);ctx.lineTo(p.x-23*Math.cos(a+.5),p.y-23*Math.sin(a+.5))}ctx.stroke();drawing=c.toDataURL('image/jpeg',.8);start=null};c.onpointercancel=()=>start=null}
async function imageData(f){if(!f||!f.type.startsWith('image/'))throw Error('画像ファイルを選んでください');return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onerror=reject;reader.onload=()=>{let im=new Image();im.onerror=()=>reject(Error('この画像形式は表示できません'));im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,1000/im.width);c.width=im.width*scale;c.height=im.height*scale;c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.8))};im.src=reader.result};reader.readAsDataURL(f)})}async function loadPhoto(f){try{basePhoto=await imageData(f);let im=new Image();im.onload=()=>{let c=$('markCanvas');c.height=im.height*c.width/im.width;c.getContext('2d').drawImage(im,0,0,c.width,c.height);drawing=c.toDataURL('image/jpeg',.8)};im.src=basePhoto}catch(e){notify(e.message)}}
function repairForm(sid){basePhoto='';drawing=null;show(`<h2>手直し案件を登録</h2><form id="repairForm"><div class="two"><div><label>現場（必須）</label><select name="site">${state.sites.map(s=>`<option value="${s.id}" ${s.id===sid?'selected':''}>${esc(s.name)}</option>`).join('')}</select><label>指示内容（必須）</label><input name="title" required placeholder="ベランダの手すりを補修"><label>場所</label><input name="location" placeholder="2階 / 202号室 / ベランダ"></div><div><label>対応期限（必須）</label><input type="date" name="due" required><label>担当者（任意）</label><input name="assignee" placeholder="未指定なら現場に行った方が対応"><label>補足</label><textarea name="note"></textarea></div></div><label>指示写真（元画像も保存）</label><input type="file" accept="image/*" onchange="loadPhoto(this.files[0])"><div class="row" style="margin:10px 0"><label>描く印</label><select style="width:150px" onchange="tool=this.value"><option value="circle">○ 丸</option><option value="cross">× バツ</option><option value="arrow">↗ 矢印</option></select><small>写真上をドラッグ</small></div><canvas id="markCanvas" width="680" height="340"></canvas>${foot('登録する')}</form>`);tool='circle';setupCanvas();$('repairForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));state.repairs.push({...d,id:Date.now(),site:Number(d.site),status:'未対応',original:basePhoto,photo:drawing,history:['登録：'+new Date().toLocaleString('ja-JP')]});save();closeModal();render()}}
function repairDetail(id){let r=state.repairs.find(r=>r.id===id);show(`<div class="row between"><h2>${esc(r.title)}</h2>${pill(r.status)}</div><p>${esc(r.location)}　期限：${esc(r.due)}</p><p>${esc(r.note)}</p>${r.photo?`<h3>指示写真</h3><img class="photo" src="${r.photo}"><details><summary>元の写真を見る</summary><img class="photo" src="${r.original}"></details>`:'<div class="notice">サンプル案件のため指示写真は未登録です。新規案件では写真を追加できます。</div>'}${r.after?`<h3>対応後</h3><img class="photo" src="${r.after}">`:''}<h3>対応履歴</h3><p>${r.history.map(esc).join('<br>')||'まだ対応されていません'}</p><div class="notice">試作では操作する人を選択します。実装時はログイン中の社員を自動記録し、確認権限も管理します。</div><label>操作する人（サンプル）</label><select id="actor"><option>山田 太郎</option><option>佐藤 花子</option><option>確認担当者</option></select>${r.status!=='完了'&&r.status!=='確認待ち'?'<label>対応後の写真（確認依頼時に必須）</label><input id="afterPhoto" type="file" accept="image/*">':''}<div class="modalfoot"><button class="secondary" onclick="closeModal()">閉じる</button>${r.status==='未対応'?`<button class="secondary" onclick="transition(${id},'対応中')">対応を開始</button>`:''}${['未対応','対応中'].includes(r.status)?`<button class="primary" onclick="transition(${id},'確認待ち')">写真を付けて確認を依頼</button>`:''}${r.status==='確認待ち'?`<button class="secondary" onclick="transition(${id},'対応中',true)">差し戻し</button><button class="primary" onclick="transition(${id},'完了')">確認して完了</button>`:''}</div>`)}async function transition(id,next,back=false){let r=state.repairs.find(r=>r.id===id),actor=$('actor').value,reason='';if(['完了'].includes(next)||back){if(actor!=='確認担当者'){notify('確認担当者を選択してください（試作の権限切替）');return}}if(back){reason=prompt('差し戻し理由を入力してください');if(!reason?.trim())return}if(next==='確認待ち'){let f=$('afterPhoto').files[0];if(!f){notify('対応後の写真を添付してください');return}try{r.after=await imageData(f)}catch(e){notify(e.message);return}}r.status=next;r.history.push(`${actor}：${back?'差し戻し':next} ${reason} / ${new Date().toLocaleString('ja-JP')}`);save();closeModal();render();notify('対応状況を更新しました')}
let fileDb;function db(){return fileDb||(fileDb=new Promise((resolve,reject)=>{let q=indexedDB.open('jinshou-site-files',1);q.onupgradeneeded=()=>q.result.createObjectStore('files');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)}))}async function storeFile(id,f){let d=await db();await new Promise((resolve,reject)=>{let t=d.transaction('files','readwrite');t.objectStore('files').put(f,id);t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}async function viewFile(id){try{let d=await db(),f=await new Promise((resolve,reject)=>{let q=d.transaction('files').objectStore('files').get(id);q.onsuccess=()=>resolve(q.result);q.onerror=reject});if(!f){notify('この端末にはファイルがありません');return}let u=URL.createObjectURL(f);if(f.type==='application/pdf'||f.type.startsWith('image/')){show(`<h2>${esc(f.name)}</h2>${f.type.startsWith('image/')?`<img style="width:100%" src="${u}">`:`<iframe title="工程表・資料プレビュー" style="width:100%;height:65vh;border:0" src="${u}"></iframe>`}<p><a href="${u}" download="${esc(f.name)}">原本をダウンロード</a></p><button class="secondary" onclick="closeModal()">閉じる</button>`);$('modal').addEventListener('close',()=>URL.revokeObjectURL(u),{once:true})}else{let a=document.createElement('a');a.href=u;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),30000);notify('原本をダウンロードします。Excel等で開いて確認できます。')}}catch{notify('ファイルを開けませんでした')}}function filePanel(){let fs=state.files.filter(f=>f.site===siteId&&f.kind===tab).sort((a,b)=>b.id-a.id);return `<section class="panel"><div class="row between"><div><h2>${tab==='工程表'?'受領した工程表を、そのまま保存':tab}</h2><p>${tab==='工程表'?'PDF・Excel・画像に対応。アップロード順に版を残します。':'現場ごとにファイルをまとめます。'}</p></div><label class="primary" style="cursor:pointer">＋ ファイルを追加<input type="file" hidden ${tab==='写真'?'accept="image/*"':'accept=".pdf,.xlsx,.xls,.png,.jpg,.jpeg,.webp"'} onchange="uploadFile(this.files[0])"></label></div><div class="notice">ファイルはこのブラウザ内だけに保存します。PDF・画像は原本を表示、Excelはダウンロードして確認する試作です。工程への自動変換・共有保存は未実装です。</div>${fs.map((f,i)=>`<div class="item row between"><div><b>${esc(f.name)}</b> ${i===0&&tab==='工程表'?pill('最新'):''}<p>第${fs.length-i}版 · ${esc(f.date)}</p></div><button class="secondary" onclick="viewFile(${f.id})">${/pdf|image/.test(f.type)?'開く':'原本を保存'}</button></div>`).join('')||'<div class="empty">ここにファイルを追加してください。<br>以前の版も削除せず残します。</div>'}</section>`}async function uploadFile(f){if(!f)return;let sid=siteId,kind=tab,id=Date.now();try{await storeFile(id,f);state.files.push({id,site:sid,kind,name:f.name,type:f.type,date:new Date().toLocaleString('ja-JP')});save();render();notify('ファイルを保存しました')}catch{notify('ファイル保存に失敗しました。容量やブラウザ設定をご確認ください')}}function taskForm(){show(`<h2>タスクを追加</h2><form onsubmit="event.preventDefault();state.tasks.push({id:Date.now(),site:siteId,title:this.title.value,done:false});save();closeModal();render()"><label>タスク名</label><input name="title" required>${foot()}</form>`)}function reportForm(){show(`<h2>報告を作成</h2><form onsubmit="event.preventDefault();state.reports.push({id:Date.now(),site:siteId,title:this.title.value,note:this.note.value,date:new Date().toLocaleString('ja-JP')});save();closeModal();render()"><label>件名</label><input name="title" required><label>報告内容</label><textarea name="note" required></textarea>${foot()}</form>`)}render();
