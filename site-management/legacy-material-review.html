<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'"><title>旧資材台帳の確認</title><style>body{font:15px 'Yu Gothic UI',sans-serif;color:#172945;background:#f3f5f9;margin:0}main{max-width:1100px;margin:32px auto;padding:24px;background:white;border:1px solid #dce3ed;border-radius:8px}button{padding:12px 18px;background:#173965;color:white;border:0;border-radius:5px;cursor:pointer}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border:1px solid #dce3ed;padding:10px;text-align:left}.scroll{max-height:65vh;overflow:auto}th{position:sticky;top:0;background:#edf2f9}#notice{padding:16px;background:#fff7e8}p{line-height:1.8}button:disabled{opacity:.4}@media(max-width:700px){main{margin:12px;padding:16px}}</style><main><h1>旧資材台帳の確認</h1><p>このブラウザーに残っている旧台帳を確認します。共有台帳への送信・登録は行いません。「見本」「検証用」と、出所の確認が必要な品目を分けて表示します。</p><p id="notice">確認中…</p><button id="backup" disabled>旧台帳を変更せずバックアップ</button><p id="summary"></p><div class="scroll"><table><thead><tr><th>分類</th><th>部材・規格</th><th>単位</th><th>旧台帳の初期数量</th><th>入出庫記録数</th><th>旧ID</th></tr></thead><tbody id="rows"></tbody></table></div><p>無印の品目も、実在庫と確認できるまでは本番へ自動登録しません。表示中の初期数量は現在の残数ではありません。</p></main><script src="legacy-material-review.js"></script></html>
