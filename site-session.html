'use strict';
const allowed=new Set(['http://localhost:3011']),api='https://tcxbtanumtuyfrqtjtvo.supabase.co/rest/v1/rpc/',key='sb_publishable_UVAjFJSjIs7Sl2tMpLWRkQ_uyDw9eyW';

function auth(){let raw=null;try{raw=localStorage.getItem('jinshou_device_auth')}catch{}if(!raw){const c=document.cookie.split('; ').find(x=>x.startsWith('jinshou_device_auth='));if(c)raw=decodeURIComponent(c.slice('jinshou_device_auth='.length))}try{return JSON.parse(raw||'null')}catch{return null}}
