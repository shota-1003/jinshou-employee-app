<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>現場の安全教育</title>
<style>body{margin:0;background:#edf2f6;color:#17314b;font:16px/1.7 system-ui,sans-serif}main{max-width:850px;margin:24px auto;padding:24px;background:white;border-radius:12px}h1{font-size:24px}button,.button{display:inline-block;padding:12px 18px;border:1px solid #a9bbcb;border-radius:6px;background:#fff;color:#17314b;font:inherit;cursor:pointer;text-decoration:none}button.primary{background:#214e7b;color:white}button:disabled{opacity:.5;cursor:wait}#status{white-space:pre-wrap;padding:12px;background:#eef4fb}iframe{width:100%;height:65vh;border:1px solid #cad3dc}#document img{max-width:100%}canvas{width:100%;height:190px;border:2px solid #49677e;background:#fff;touch-action:none;display:block}label{display:block;margin:18px 0}input{width:22px;height:22px;vertical-align:middle}small{display:block}.test{background:#fff2cc;padding:12px}#signArea[hidden]{display:none}@media(max-width:600px){main{margin:0;padding:18px}}</style>
<main><a href="./">← ポータルへ</a><h1>現場の安全教育</h1><p id="status" role="status">本人確認中…</p><section id="details" hidden><p id="test" class="test" hidden>配信・サインの動作テストです。実際の現場教育の受講記録とは区別して保存します。</p><h2 id="title"></h2><p id="meta"></p><p><a id="file" class="button" target="_blank" rel="noopener">書類を別画面で開く</a></p><div id="document"></div><section id="signArea" hidden><h2>内容の確認とサイン</h2><p id="person"></p><label><input id="agreed" type="checkbox"> 私はこの書類の内容を確認し、説明を理解しました。不明な点は担当者に確認しました。</label><p>ご本人が下の枠にお名前を手書きしてください。</p><canvas id="signature" width="1000" height="320" aria-label="本人の手書きサイン欄"></canvas><p><button id="clear" type="button">サインを書き直す</button></p><button id="submit" class="primary" type="button">確認とサインを送信する</button><small>送信後、現場管理に受講済みとして反映されます。書類を開くだけでは受講済みになりません。</small></section></section></main>
<script>
'use strict';
const URL='https://tcxbtanumtuyfrqtjtvo.supabase.co',KEY='sb_publishable_UVAjFJSjIs7Sl2tMpLWRkQ_uyDw9eyW';
const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('id');let auth,data,drawn=0,down=false,last,documentUrl=null;
function currentAuth(){let raw;try{raw=localStorage.getItem('jinshou_sub_auth')}catch{}if(!raw){const c=document.cookie.split('; ').find(x=>x.startsWith('jinshou_sub_auth='));if(c)raw=decodeURIComponent(c.slice('jinshou_sub_auth='.length))}if(!raw)try{raw=sessionStorage.getItem('jinshou_sub_auth')}catch{}try{return JSON.parse(raw||'null')}catch{return null}}
async function rpc(name,args){const active=currentAuth();if(!active||active.loginCode!==auth.loginCode||active.token!==auth.token)throw Error('ログインが変わりました。ポータルから開き直してください');const res=await fetch(URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY,'X-Sub-Device-Token':auth.token},body:JSON.stringify(args),signal:AbortSignal.timeout(30000)});const body=await res.json();const after=currentAuth();if(after?.loginCode!==auth.loginCode||after?.token!==auth.token)throw Error('ログインが変わりました。ポータルから開き直してください');if(!res.ok)throw Error(body.message||'送信できませんでした。接続を確認して再度お試しください。');return body}
const canvas=$('signature'),ctx=canvas.getContext('2d');ctx.lineWidth=4;ctx.lineCap='round';ctx.strokeStyle='#142b42';
function point(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
canvas.onpointerdown=e=>{if($('submit').disabled)return;down=true;last=point(e);canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{if(!down)return;const p=point(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();drawn+=Math.hypot(p.x-last.x,p.y-last.y);last=p};
canvas.onpointerup=canvas.onpointercancel=()=>{down=false};
$('clear').onclick=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);drawn=0};
function complete(stamp){$('signArea').hidden=true;$('status').textContent=(data.test_only?'受講済み（テスト）':'受講済み')+' — '+new Date(stamp).toLocaleString('ja-JP')+'\n確認とサインを保存しました。現場管理側に反映されます。'}
$('submit').onclick=async()=>{if(!$('agreed').checked){$('status').textContent='内容を確認し、確認欄にチェックしてください。';return}if(drawn<80){$('status').textContent='枠内にご本人のお名前をサインしてください。';return}const b=$('submit');b.disabled=true;$('clear').disabled=true;try{const stamp=await rpc('site_worker_education_sign',{p_login_code:auth.loginCode,p_id:id,p_document_hash:data.document_hash,p_signature:canvas.toDataURL('image/png'),p_agreed:true});complete(stamp)}catch(e){$('status').textContent=e.message}finally{b.disabled=false;$('clear').disabled=false}};
(async()=>{try{auth=currentAuth();if(!auth?.loginCode||!auth?.token)throw Error('ポータルへのログインが必要です。上の「ポータルへ」からログインし、お知らせのリンクをもう一度開いてください。');if(!/^[0-9a-f-]{36}$/i.test(id||''))throw Error('教材のリンクが正しくありません。ポータルのお知らせから開いてください。');data=await rpc('site_worker_education_open',{p_login_code:auth.loginCode,p_id:id});$('details').hidden=false;$('test').hidden=!data.test_only;$('title').textContent=data.title;$('meta').textContent=data.site_name+' ／ '+data.version;$('person').textContent='確認する方：'+data.name;const bytes=Uint8Array.from(atob(data.document_base64),c=>c.charCodeAt(0));const url=documentUrl=window.URL.createObjectURL(new Blob([bytes],{type:data.mime}));$('file').href=url;const view=document.createElement(data.mime==='application/pdf'?'iframe':'img');view.src=url;view.title=data.title;view.alt=data.title;$('document').append(view);$('status').textContent='書類の内容を確認し、下の欄からサインを送信してください。';if(data.signed_at)complete(data.signed_at);else $('signArea').hidden=false}catch(e){$('status').textContent=e.message}})();
function clearChangedAccount(){if(!auth)return;const active=currentAuth();if(active?.loginCode===auth.loginCode&&active?.token===auth.token)return;document.getElementById('details').hidden=true;document.getElementById('document').replaceChildren();if(documentUrl){window.URL.revokeObjectURL(documentUrl);documentUrl=null}$('file').removeAttribute('href');data=null;down=false;$('agreed').checked=false;ctx.clearRect(0,0,canvas.width,canvas.height);drawn=0;document.getElementById('status').textContent='ログインが変わりました。ポータルから開き直してください';}
window.addEventListener('pagehide',()=>{if(documentUrl)window.URL.revokeObjectURL(documentUrl)});window.addEventListener('storage',clearChangedAccount);window.addEventListener('focus',clearChangedAccount);
</script></html>
